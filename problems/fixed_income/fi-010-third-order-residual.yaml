id: fi-010
category: fixed_income
kind: compute
solver: scenario
answer_field: residual_bp
unit: "basis points"
tolerance: 0.05

prompt: |
  Same reference bond (EUR 1,000 face, 4% semi-annual coupon, issued
  15 March 2024, maturing 15 March 2029, trading at 97.80% clean on
  11 September 2025, ACT/ACT ICMA). Estimate its new price after a 100 basis
  point rise in yield two ways: (1) the exact price, by discounting every
  remaining cash flow at the new yield, and (2) the duration-plus-convexity
  second-order approximation. What is the gap between the two, in basis
  points of the original price? This isolates the true third-order term the
  second-order approximation leaves out — a bond of this maturity should
  have a gap under 1 basis point. A gap of several basis points means the
  duration or convexity feeding the approximation was wrong, not that the
  Taylor expansion was truncated.

inputs:
  face_value: 1000
  coupon_rate_pct: 4.0
  payments_per_year: 2
  issue_date: "2024-03-15"
  maturity_date: "2029-03-15"
  settlement_date: "2025-09-11"
  day_count: "ACT/ACT ICMA"
  clean_price_pct_of_face: 97.80
  shock_bp: 100
