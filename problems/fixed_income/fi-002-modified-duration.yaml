id: fi-002
category: fixed_income
kind: compute
solver: price_yield
answer_field: modified_duration_years
unit: "years"
tolerance: 0.005
known_failure_modes:
  naive_annualisation: naive_modified_duration_years

prompt: |
  Same bond as before: EUR 1,000 face, 4% annual coupon paid semi-annually,
  issued 15 March 2024, maturing 15 March 2029, trading at 97.80% clean on
  11 September 2025 (ACT/ACT ICMA). What is its modified duration, in years?

inputs:
  face_value: 1000
  coupon_rate_pct: 4.0
  payments_per_year: 2
  issue_date: "2024-03-15"
  maturity_date: "2029-03-15"
  settlement_date: "2025-09-11"
  day_count: "ACT/ACT ICMA"
  clean_price_pct_of_face: 97.80
