[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-benchmark"
version = "0.1.0"
description = "Reference-computed finance problems for grading model reasoning, not just final numbers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "José Navarro" }]
dependencies = ["bondmath>=0.1.2", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finance-benchmark = "benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
