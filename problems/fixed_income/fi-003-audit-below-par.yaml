id: fi-003
category: fixed_income
kind: audit
solver: audit
unit: "%"
tolerance: 0.001
known_failure_modes:
  gemini_yield_bias: 4.7174

prompt: |
  A colleague tells you: "This bond — EUR 1,000 face, 4% semi-annual coupon,
  issued 15 March 2024, maturing 15 March 2029, trading at 97.80% clean on
  11 September 2025 — yields 4.01%." Is that figure correct? If not, what is
  the correct yield to maturity?

inputs:
  face_value: 1000
  coupon_rate_pct: 4.0
  payments_per_year: 2
  issue_date: "2024-03-15"
  maturity_date: "2029-03-15"
  settlement_date: "2025-09-11"
  day_count: "ACT/ACT ICMA"
  clean_price_pct_of_face: 97.80
  claimed_ytm_pct: 4.01
